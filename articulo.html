<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | Ingeny Labs</title>
    <link rel="icon" type="image/png" href="./assets/favico.png">
    <style>
        @font-face {
            font-family: 'Cal Sans';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url(https://fonts.gstatic.com/s/calsans/v2/fdN99sWUv3gWqXxqqSBb.ttf) format('truetype');
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* ═══ TOKENS ═══ */
        :root {
            --bg: #0a0a0f;
            --bg2: #0d0d16;
            --card: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.07);
            --card-hover: rgba(255, 255, 255, 0.055);
            --green: #24BD58;
            --mint: #CCFFD3;
            --dk-green: #002608;
            --muted: rgba(255, 255, 255, 0.55);
            --sep: rgba(255, 255, 255, 0.05);
            --glow: 0 0 80px rgba(36, 189, 88, 0.12);
            --rad: 18px;
            --rad-sm: 10px;
        }

        /* ═══ RESET / BASE ═══ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html { scroll-behavior: smooth; background: var(--bg); }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-top: 80px;
        }
        a { text-decoration: none; color: inherit; }
        img { display: block; max-width: 100%; }

        /* ═══ NAV ═══ */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid var(--sep);
        }
        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-links { display: none; gap: 36px; }
        .nav-link { font-size: .875rem; font-weight: 500; color: rgba(255, 255, 255, .6); letter-spacing: .02em; transition: color .2s; }
        .nav-link:hover, .nav-link.active { color: var(--mint); }
        .nav-cta { display: none; align-items: center; gap: 20px; }
        @media(min-width:900px) { .nav-links { display: flex; } .nav-cta { display: flex; } #mobile-menu-btn { display: none; } }

        /* ═══ BUTTONS ═══ */
        .btn {
            display: inline-flex; align-items: center; gap: 9px;
            font-family: 'Manrope', sans-serif; font-weight: 800; border: none; cursor: pointer; transition: all .25s ease;
        }
        .btn-primary {
            background: var(--mint); color: var(--dk-green); padding: 15px 34px; border-radius: 100px;
            box-shadow: 0 0 40px rgba(204, 255, 211, .12); font-size: .95rem;
        }
        .btn-primary:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 8px 40px rgba(204, 255, 211, .22); }
        .btn-back {
            display: inline-flex; align-items: center; gap: 8px; color: var(--mint); font-size: .9rem; font-weight: 600;
            margin-bottom: 40px; transition: color .2s;
        }
        .btn-back:hover { color: #fff; }

        /* ═══ ARTICLE ═══ */
        .article-wrap {
            max-width: 800px;
            margin: 60px auto 120px;
            padding: 0 36px;
        }
        .article-header {
            margin-bottom: 40px;
        }
        .article-meta {
            display: flex; gap: 16px; align-items: center; font-size: .85rem; font-weight: 600;
            color: var(--muted); margin-bottom: 24px; letter-spacing: .05em; text-transform: uppercase;
        }
        .article-meta span { color: var(--green); }
        .article-h1 {
            font-family: 'Cal Sans', system-ui, sans-serif; font-size: clamp(2rem, 4.5vw, 3.5rem);
            line-height: 1.1; margin-bottom: 30px; text-wrap: pretty;
        }
        .article-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
        .tag { font-size: .75rem; padding: 6px 14px; background: rgba(36, 189, 88, .07); border-radius: 6px; color: var(--mint); border: 1px solid rgba(36, 189, 88, .2); font-weight: 600;}
        
        .article-hero-img {
            width: 100%; height: auto; max-height: 450px; object-fit: cover; border-radius: var(--rad);
            margin-bottom: 60px; box-shadow: var(--glow); border: 1px solid var(--card-border);
        }

        .article-content {
            font-size: 1.1rem; line-height: 1.8; color: rgba(255, 255, 255, .85);
        }
        .article-content .sh2 {
            font-family: 'Cal Sans', system-ui, sans-serif; font-size: 2rem; color: #fff; margin-top: 3rem; margin-bottom: 1.5rem;
        }
        .article-content p { margin-bottom: 1.5rem; }
        .article-content span { color: var(--mint); font-weight: 600; }
        .article-content strong { color: #fff; font-weight: 700; }
        .article-content em { color: var(--green); font-style: normal; font-weight: 600;}
        
        /* ═══ FOOTER ═══ */
        .footer {
            background: var(--green); color: var(--dk-green); padding: 28px 44px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        
        /* Loader */
        #loader { text-align: center; padding: 100px; font-size: 1.2rem; color: var(--mint); }
        #error-msg { display: none; text-align: center; padding: 100px; color: #ff5555; }
    </style>
</head>

<body>

    <header class="nav">
        <div class="nav-inner">
            <a href="index.html"><img src="./assets/logo.svg" alt="Ingeny Labs" style="height:46px;object-fit:contain;"></a>
            <nav class="nav-links">
                <a href="index.html#nosotros" class="nav-link">Nosotros</a>
                <a href="index.html#servicios" class="nav-link">Servicios</a>
                <a href="index.html#casos-uso" class="nav-link">Casos de Uso</a>
                <a href="index.html#metodologia" class="nav-link">Metodología</a>
                <a href="blog.html" class="nav-link">Blog</a>
            </nav>
            <div class="nav-cta">
                <a href="https://wa.me/56954679270" target="_blank" class="btn btn-primary" style="padding:11px 26px;font-size:.875rem;">Consultoría gratuita</a>
            </div>
        </div>
    </header>

    <div class="article-wrap" id="article-container">
        <div id="loader">Cargando artículo...</div>
        <div id="error-msg">
            <h2 class="sh2">Artículo no encontrado</h2>
            <a href="blog.html" class="btn-back">Volver al Blog</a>
        </div>
        
        <div id="content-wrapper" style="display:none;">
            <a href="blog.html" class="btn-back">
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Volver al Blog
            </a>
            
            <header class="article-header">
                <div class="article-meta">
                    <span id="a-author"></span> • <span id="a-date"></span>
                </div>
                <h1 class="article-h1" id="a-title"></h1>
                <div class="article-tags" id="a-tags"></div>
            </header>
            
            <img src="" alt="" class="article-hero-img" id="a-img">
            
            <div class="article-content" id="a-content">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <img src="./assets/logo.svg" alt="Ingeny Labs" style="height:38px;object-fit:contain;filter:brightness(0);">
        <span style="font-size:.82rem;font-weight:600;">© 2026 Ingeny Labs. Operated by Nodepath Cognitive Systems SpA</span>
    </footer>

    <script src="blog-data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id'));
            
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('error-msg');
            const contentWrapper = document.getElementById('content-wrapper');
            
            if (id && blogArticles) {
                const article = blogArticles.find(a => a.id === id);
                
                if (article) {
                    // Update meta tags for title dynamically
                    document.title = article.title + " | Ingeny Labs Blog";
                    
                    document.getElementById('a-title').innerText = article.title;
                    document.getElementById('a-author').innerText = article.author;
                    document.getElementById('a-date').innerText = article.date;
                    
                    document.getElementById('a-img').src = article.image;
                    document.getElementById('a-img').alt = article.title;
                    
                    document.getElementById('a-tags').innerHTML = article.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                    document.getElementById('a-content').innerHTML = article.content;
                    
                    loader.style.display = 'none';
                    contentWrapper.style.display = 'block';
                } else {
                    loader.style.display = 'none';
                    errorMsg.style.display = 'block';
                }
            } else {
                loader.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
